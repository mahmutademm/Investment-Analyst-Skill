[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iat-toolkit"
dynamic = ["version"]
description = "Investment Analyst Toolkit: data pulls, screens, forensic ratios and Excel builders for the investment-analyst agent skills."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mahmut A Ergin"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "yfinance>=0.2.60",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.scripts]
iat = "iat.cli:main"

[tool.setuptools.dynamic]
version = {attr = "iat.__version__"}

[tool.setuptools.packages.find]
include = ["iat*"]

[tool.setuptools.package-data]
iat = ["templates/workspace/*", "templates/workspace/*/*", "templates/workspace/*/*/*"]
