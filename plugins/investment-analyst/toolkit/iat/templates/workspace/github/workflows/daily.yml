name: daily-macro-rotation

# Weekdays after the US close: FRED macro snapshot, sector/sub-industry relative strength,
# watchlist stop checks. Results are committed to data/ so `git pull` brings them to your PC.
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 6:30 pm New York (EDT)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: iat-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .toolkit/pyproject.toml
      - name: Install toolkit
        run: pip install ./.toolkit
      - name: Run daily jobs
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: iat daily
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/latest data/reports data/universes
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase --autostash
          git push
