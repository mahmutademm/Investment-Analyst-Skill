name: weekly-screen

# Saturday: re-screen every sub-industry listed in config/state.yaml (screening.active).
# Yahoo sometimes rate-limits GitHub's shared IPs. If this job keeps failing, run `iat weekly`
# on your own PC and push, or lower settings.screening.max_tickers.
on:
  schedule:
    - cron: "0 14 * * 6"      # Saturday 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: iat-data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .toolkit/pyproject.toml
      - name: Install toolkit
        run: pip install ./.toolkit
      - name: Run weekly screens
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: iat weekly
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/latest data/reports data/screens data/universes
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: weekly screens $(date -u +%F)"
          git pull --rebase --autostash
          git push
